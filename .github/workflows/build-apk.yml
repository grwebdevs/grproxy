name: Build GRPROXY Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Scaffold Android Project
        working-directory: ./app
        run: |
          rm -rf android
          flutter create --platforms=android --org com.grproxy .

      - name: Install Dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Build APKs
        working-directory: ./app
        run: |
          flutter build apk --debug > build.log 2>&1 || {
            echo "=== BUILD LOG ERROR SUMMARY ==="
            tail -n 100 build.log
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: app/build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grproxy-apk
          path: app/build/app/outputs/flutter-apk/*.apk
